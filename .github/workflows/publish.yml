name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # Required for OIDC / Trusted Publishing

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Rocket.NET.sln

      - name: Build Core
        run: dotnet build Core/Core.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Build Tests
        run: dotnet build Tests/Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Tests/Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          dotnet pack Core/Core.csproj \
            -c Release \
            --no-build \
            -o ./artifacts \
            -p:Version=${{ steps.version.outputs.value }}

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: hudson1998x

      # Push the package
      - name: NuGet push
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate